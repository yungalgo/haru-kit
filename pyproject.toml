[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haru-kit"
description = "Run Haru-4B, the open full-duplex voice model, with one command on Mac, NVIDIA, or Modal"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "yung algorithm" }]
requires-python = ">=3.11"
dynamic = ["version"]
keywords = ["haru", "haru-4b", "voice", "speech", "full-duplex", "mlx", "modal", "vllm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "rich>=13",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/yungalgo/haru-kit"
Repository = "https://github.com/yungalgo/haru-kit"
Issues = "https://github.com/yungalgo/haru-kit/issues"
Changelog = "https://github.com/yungalgo/haru-kit/blob/main/CHANGELOG.md"
Registry = "https://github.com/yungalgo/haru-characters"

[project.optional-dependencies]
pipecat = [
    "pipecat-ai[websocket,twilio,telnyx]>=1.9,<2",
]
livekit = [
    "livekit-agents>=1.8.1,<1.9",
]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[project.scripts]
haru-kit = "haru_kit.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "haru_kit.__version__" }

[tool.setuptools.packages.find]
include = ["haru_kit*"]

[tool.setuptools.package-data]
haru_kit = [
    "assets/*",
    "runtime/*.py",
    "static/**/*",
    "apps/UPSTREAM.md",
    "apps/mac/README.md",
    "apps/mac/build_app.sh",
    "apps/mac/App/*.swift",
    "apps/mac/CLI/*.swift",
    "apps/mac/Shared/*.swift",
    "apps/mac/Resources/**/*",
]

[tool.setuptools.exclude-package-data]
haru_kit = [
    "apps/mac/build/**/*",
    "apps/mac/.build/**/*",
    "apps/mac/Tests/**/*",
    "apps/strings/**/*",
    "apps/web/**/*",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
